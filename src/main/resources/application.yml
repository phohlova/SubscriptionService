server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true

  application:
    name: subscription-service

  datasource:
    url: jdbc:postgresql://localhost:5433/subscription_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    com.example.subscriptionservice: DEBUG
    org.springframework.web: DEBUG

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans,configprops
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
  metrics:
    tags:
      application: subscription-service
  prometheus:
    metrics:
      export:
        enabled: true

# Info endpoint
info:
  app:
    name: "Subscription Service"
    description: "Service for tracking user subscriptions"
    version: "0.0.1-SNAPSHOT"